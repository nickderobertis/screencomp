# Local git hooks. Install with `just hooks-install`; run on demand with `just hooks`.
# Fast checks gate commits; heavier checks gate pushes. No check may pass with
# warnings — clippy runs with `-D warnings`.

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    conflicts:
      # Detects unresolved merge-conflict markers and whitespace errors.
      run: git diff --cached --check
    large-files:
      run: |
        bash -c '
          max=$((512 * 1024)); ec=0
          for f in $(git diff --cached --name-only --diff-filter=AM); do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt "$max" ]; then
              echo "blocked: $f is ${size} bytes (>512KiB)"; ec=1
            fi
          done
          exit $ec'

pre-push:
  parallel: false
  commands:
    clippy:
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
    test:
      # The crate's in-process suites; the binary e2e suite is its own workspace
      # member (e2e/) and runs in the gate.
      run: cargo nextest run --locked -p screencomp
    llmlint-validate:
      # The deterministic llmlint gate (no model, no credential): a broken config,
      # a stale `llmlint: ignore`, or an unbumped fragment fails here before CI.
      # Skips, saying so, where llmlint is not installed (`just setup-llmlint`).
      run: |
        if ! command -v llmlint >/dev/null 2>&1; then
          echo "llmlint not installed; skipping 'llmlint validate' (run 'just setup-llmlint' to enable it)"
          exit 0
        fi
        llmlint validate
