# Standard visual-docs configuration: image-free baselines via digest manifest,
# capture in one pinned Linux/amd64 container.
#
# The repository commits only a tiny per-platform digest *manifest*
# (`shots/baseline/<platform>.sha256`), never the baseline PNGs — so it never
# accumulates binary history and grows without bound. screencomp compares by
# content digest, so the manifest is all that `classify`/`comment` need.
#
# Lifecycle:
#   * Seed once:   capture, then `screencomp manifest ... > the .sha256`, commit.
#   * On a PR:     capture, classify against the committed manifest, post a
#                  listing comment, and push a regenerated manifest to the PR
#                  branch. Its text diff (old hash -> new hash per shot) is the
#                  review record; merging the PR accepts the new baseline.
#                  If the repo enforces required status checks, that push needs
#                  a token that can trigger workflows — see the checkout step.
#   * On main:     capture and publish the gallery to Pages — the browseable,
#                  blessed "current state". Pages is NOT a baseline store (the
#                  manifest is), so it is only deployed here, never from a PR.
#
# Why a container, even on macOS: a screenshot's bytes depend on the OS, CPU,
# fonts, and GPU that rendered it. macOS cannot run Linux containers natively
# (Docker runs a Linux VM), so `--platform=linux/amd64` reproduces the same
# linux/amd64 pixels as CI, giving one platform key (`linux-x86_64`) and
# byte-for-byte reproducibility. `--platform auto` resolves to it because
# screencomp runs INSIDE the container. See the screencomp README
# ("Cross-platform comparison") for the determinism details.
#
# Prerequisites:
#   * A committed baseline manifest at shots/baseline/linux-x86_64.sha256. Seed
#     it once (before the first PR, or the manifest steps below have nothing to
#     compare against): run the capture, then
#       screencomp manifest --input shots/current --platform auto \
#         --output shots/baseline/linux-x86_64.sha256
#     and commit it.
#   * GitHub Pages enabled (Settings -> Pages -> GitHub Actions).
name: Visual docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: visual-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-docs:
    runs-on: ubuntu-latest # amd64; the container therefore runs native amd64.
    container: mcr.microsoft.com/playwright:v1.60.0-noble # pin to your Playwright version
    permissions:
      contents: write # commit the regenerated manifest to the PR branch
      pull-requests: write # post the diff comment
      pages: write # deploy the gallery (on main)
      id-token: write # Pages deployment auth
    env:
      SHOTS_OUT: shots/current/linux-x86_64
      MANIFEST: shots/baseline/linux-x86_64.sha256
      # Chromium flags, set via your Playwright config's launchOptions.args
      # (listed here so the contract is visible). They split into two kinds:
      #
      # DETERMINISM — change the bytes; mandatory for byte-reproducibility:
      #   --disable-skia-runtime-opts            # CPU-independent path: key flag
      #   --headless=new --disable-gpu --disable-gpu-rasterization
      #   --use-gl=angle --use-angle=swiftshader
      #   --force-color-profile=srgb
      #   --font-render-hinting=none --disable-lcd-text --hide-scrollbars
      # plus deviceScaleFactor: 1 and a fixed viewport.
      #
      # STABILITY / EMULATION — change only the process model; leave bytes
      # identical, so add or drop per environment:
      #   --disable-dev-shm-usage --ipc=host
      #   --single-process    # OK for static pages; turn OFF for interactive
      #                       # ones — the renderer can fault and take the whole
      #                       # single-process browser down. See the README's
      #                       # "Capturing an interactive app".
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }} # PR branch (empty on push -> the main ref)
          # Token for the manifest push below. The default GITHUB_TOKEN is fine
          # ONLY while this repo has no required status checks: GitHub never
          # starts workflow runs for GITHUB_TOKEN pushes, so after the bot
          # commit the new head has NO runs and every required check — this
          # workflow or any other — sticks at "Expected — Waiting for status to
          # be reported", blocking the PR. If you enforce required checks, set
          # VISUAL_DOCS_PUSH_TOKEN to a credential that can trigger workflows: a
          # fine-grained PAT or GitHub App token with contents read/write. See
          # examples/README.md ("Branch protection") for the trade-offs.
          token: ${{ secrets.VISUAL_DOCS_PUSH_TOKEN || github.token }}

      - uses: nickderobertis/screencomp@v0.1.9 # pin to a released tag
        with:
          version: latest

      # Replace with your real capture; it MUST write $SHOTS_OUT/<project>/<name>.png.
      - name: Capture screenshots
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      # Reproducibility gate: capture again, require byte-identical output. This
      # is what makes image-free baselines safe — the committed digests are only
      # meaningful if capture is deterministic on this machine. A failure here is
      # almost always a JS-animated or async-rendered widget caught mid-transition
      # (see the README's "Capturing an interactive app"). Move to a nightly
      # `schedule:` trigger if you want to halve per-PR capture cost.
      - name: Verify capture is reproducible
        run: |
          set -euo pipefail
          SHOTS_OUT=shots/verify/linux-x86_64 npx playwright test
          screencomp verify --first shots/current --second shots/verify --platform auto
          rm -rf shots/verify

      # The check: compare the capture against the committed digest manifest.
      # Differences are EXPECTED on a feature PR, so this does not fail the job —
      # the change is surfaced by the comment and the committed manifest diff,
      # not a red check. Drop `|| true` if you want changes to block instead.
      - name: Classify against the baseline manifest
        run: |
          screencomp classify --baseline-manifest "$MANIFEST" \
            --current shots/current --platform auto || true

      # ---- PR only: comment + push the regenerated manifest -----------------

      # Sticky comment listing changed shots. No --gallery-url: a live per-PR
      # gallery would need its own hosting (a single Pages site can't preview
      # PRs without clobbering main). Review is the listing plus the manifest
      # diff below; the browseable gallery is the main deployment. To add a link,
      # set --gallery-url to your published Pages URL.
      - name: Comment screenshot diff
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          screencomp comment --baseline-manifest "$MANIFEST" \
            --current shots/current --platform auto --output comment.md
          gh pr comment "${PR}" --body-file comment.md --edit-last \
            || gh pr comment "${PR}" --body-file comment.md

      # Regenerate the manifest from this run and push it to the PR branch. Its
      # text diff (old hash -> new hash per shot) is the review surface; merging
      # accepts the new baseline. Tiny, so the repo never accrues binary history.
      #
      # Loop-safe with ANY token: a re-triggered run regenerates an identical
      # manifest, sees no diff below, and does not push — at most one extra run.
      # With the default GITHUB_TOKEN the push triggers no CI at all, which is
      # fine without required checks but strands the PR with them (see the
      # checkout step). A PR already stranded this way recovers as soon as the
      # branch moves under real user credentials — e.g. amend the bot's manifest
      # commit into your own and push.
      - name: Update the baseline manifest on the PR branch
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          screencomp manifest --input shots/current --platform auto --output "$MANIFEST"
          if [ -n "$(git status --porcelain "$MANIFEST")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$MANIFEST"
            git commit -m "chore: update screenshot baseline manifest"
            git push
          fi

      # ---- main only: publish the blessed gallery to Pages -----------------

      - name: Build gallery
        if: ${{ github.event_name == 'push' }}
        run: screencomp gallery --input shots/current --platform auto --output site --title "Visual docs"
      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        if: ${{ github.event_name == 'push' }}
        uses: actions/deploy-pages@v4

# Local pre-push check (same image as CI, so captures match). On Apple Silicon
# --platform forces the amd64 image under emulation. Enable Docker Desktop's
# Rosetta ("Use Rosetta for x86_64/amd64 emulation"); the swiftshader render path
# can crash Chromium under the QEMU fallback (`qemu: uncaught target signal`).
#
#   docker run --rm --platform=linux/amd64 --ipc=host --shm-size=2g \
#     -v "$PWD:/work" -w /work \
#     mcr.microsoft.com/playwright:v1.60.0-noble \
#     bash -lc 'npm ci && SHOTS_OUT=shots/current/linux-x86_64 npx playwright test'
#   screencomp classify --baseline-manifest shots/baseline/linux-x86_64.sha256 \
#     --current shots/current --platform linux-x86_64
