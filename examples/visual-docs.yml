# Standard visual-docs configuration: image-free baselines via digest manifest,
# capture in one pinned Linux container. This hand-rolled workflow is the strict
# gate (the recommended model); for the batteries-included version see the
# reusable workflow in the screencomp README ("Batteries-included reusable
# workflow"), which this mirrors. This single-arch example captures one arch
# (x86_64); to support more, add an arch lane (a runner of that arch, a separate
# shots/current/<arch> and shots/baseline/<arch>.json).
#
# A capture is a directory holding a `captures.json` index plus the PNGs it
# references; your capture step writes the index and each shot's hash. The
# repository commits only a tiny per-arch digest *manifest*
# (`shots/baseline/<arch>.json` — the index with image paths stripped), never the
# baseline PNGs, so it never accumulates binary history and grows without bound.
# screencomp compares by content digest, so the manifest is all that
# `classify`/`comment` need.
#
# Lifecycle (STRICT gate — the developer owns the baseline):
#   * Seed once:   capture, then `screencomp manifest ... > the .json`, commit.
#   * Locally:     the pre-push guard (examples/pre-push) re-captures on relevant
#                  changes, regenerates the manifest, and blocks the push until you
#                  COMMIT it — so an intended change is already reflected by the
#                  time CI runs.
#   * On a PR:     capture, then `classify --exit-code` FAILS the job on any drift
#                  from the committed manifest. A red check means the baseline
#                  wasn't updated locally; regenerate and commit it. The comment
#                  shows before/after by diffing the PR base branch's manifest.
#   * On main:     capture and publish the gallery to Pages — the browseable,
#                  blessed "current state". Pages is NOT a baseline store (the
#                  manifest is), so it is only deployed here, never from a PR.
#
# Because nothing is pushed back to the PR branch, this needs no elevated token
# and never trips the required-status-check problem that auto-push has. To switch
# to the lighter CI-auto-accept model instead (CI moves the baseline for you),
# drop `--exit-code` from classify and re-enable the manifest push step at the
# bottom; that variant needs `contents: write` and, under branch protection, a
# trigger-capable token (see examples/README.md, "Branch protection").
#
# Why a container: a screenshot's bytes depend on the OS, CPU, fonts, and GPU that
# rendered it. Pinning capture to one Linux container fixes the OS everywhere — on
# CI and locally — so the ONLY dimension left is the CPU arch. The container is the
# arch's runner image (amd64 here); on macOS, which can't run Linux containers
# natively (Docker runs a Linux VM), `--platform=linux/amd64` reproduces the same
# x86_64 pixels as CI. `--arch auto` resolves to the container's arch because
# screencomp runs INSIDE it. Native macOS/Windows captures are NOT supported — they
# could never be byte-reproducible against CI. See the screencomp README
# ("Per-arch comparison") for the determinism details.
#
# Prerequisites:
#   * A committed baseline manifest at shots/baseline/x86_64.json. Seed it once
#     (before the first PR, or the classify step has nothing to compare against):
#     run the capture, then
#       screencomp manifest --input shots/current --arch auto \
#         --output shots/baseline/x86_64.json
#     and commit it.
#   * GitHub Pages enabled (Settings -> Pages -> GitHub Actions).
name: Visual docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel only superseded PR previews; never the canonical (push-to-main) deploy or
# the scheduled prune. They share the refs/heads/main concurrency key, so cancelling
# would let a follow-up push kill an in-flight gallery deploy — queue them instead.
concurrency:
  group: visual-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-docs:
    runs-on: ubuntu-latest # amd64; the container therefore runs native amd64.
    container: mcr.microsoft.com/playwright:v1.60.0-noble # pin to your Playwright version
    permissions:
      contents: read # nothing is pushed back to the branch under the strict gate
      pull-requests: write # post the diff comment
      pages: write # deploy the gallery (on main)
      id-token: write # Pages deployment auth
    env:
      SHOTS_OUT: shots/current/x86_64
      MANIFEST: shots/baseline/x86_64.json
      # Chromium flags, set via your Playwright config's launchOptions.args
      # (listed here so the contract is visible). They split into two kinds:
      #
      # DETERMINISM — change the bytes; mandatory for byte-reproducibility:
      #   --disable-skia-runtime-opts            # CPU-independent path: key flag
      #   --headless=new --disable-gpu --disable-gpu-rasterization
      #   --use-gl=angle --use-angle=swiftshader
      #   --force-color-profile=srgb
      #   --font-render-hinting=none --disable-lcd-text --hide-scrollbars
      # plus deviceScaleFactor: 1 and a fixed viewport.
      #
      # STABILITY / EMULATION — change only the process model; leave bytes
      # identical, so add or drop per environment:
      #   --disable-dev-shm-usage --ipc=host
      #   --single-process    # OK for static pages; turn OFF for interactive
      #                       # ones — the renderer can fault and take the whole
      #                       # single-process browser down. See the README's
      #                       # "Capturing an interactive app".
    steps:
      - uses: actions/checkout@v4

      - uses: nickderobertis/screencomp@v0 # pin to a released tag
        with:
          version: latest

      # Replace with your real capture; it MUST leave $SHOTS_OUT/captures.json
      # (the index) beside the PNGs it references. Either hash the shots in the
      # capture itself, or write only the PNGs and let the CLI author the index —
      # screencomp is installed in this job, so `index` is available here:
      #   screencomp index --input "$SHOTS_OUT" --toggles-from-path
      - name: Capture screenshots
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      # Reproducibility gate: capture again, require byte-identical output. This
      # is what makes image-free baselines safe — the committed digests are only
      # meaningful if capture is deterministic on this machine. A failure here is
      # almost always a JS-animated or async-rendered widget caught mid-transition
      # (see the README's "Capturing an interactive app"). Move to a nightly
      # `schedule:` trigger if you want to halve per-PR capture cost.
      - name: Verify capture is reproducible
        run: |
          set -euo pipefail
          SHOTS_OUT=shots/verify/x86_64 npx playwright test
          screencomp verify --first shots/current --second shots/verify --arch auto
          rm -rf shots/verify

      # The strict gate: FAIL the job when the capture drifts from the committed
      # baseline. You regenerate and COMMIT the baseline locally (the pre-push
      # guard) before pushing, so an intended change is already reflected here and
      # this stays green; CI goes red only on drift you missed. To auto-accept
      # instead, drop `--exit-code` and re-enable the manifest push step below.
      - name: Classify against the baseline manifest
        run: |
          set -euo pipefail
          screencomp classify --baseline-manifest "$MANIFEST" \
            --current shots/current --arch auto --exit-code

      # ---- PR only: before/after comment ------------------------------------

      # Sticky comment listing changed shots. Under the strict gate the committed
      # manifest already matches the capture, so source "Before" from the PR base
      # branch's manifest to show the intended diff (gate vs committed, comment vs
      # base). No --gallery-url: a live per-PR gallery would need its own hosting
      # (a single Pages site can't preview PRs without clobbering main). To add a
      # link, set --gallery-url to your published Pages URL.
      - name: Comment screenshot diff
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          comment_manifest="$MANIFEST"
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF" || true
            if git show "origin/${BASE_REF}:${MANIFEST}" >base-manifest.json 2>/dev/null; then
              comment_manifest="base-manifest.json"
            fi
          fi
          screencomp comment --baseline-manifest "$comment_manifest" \
            --current shots/current --arch auto --output comment.md
          gh pr comment "${PR}" --body-file comment.md --edit-last \
            || gh pr comment "${PR}" --body-file comment.md

      # CI-auto-accept opt-in (DISABLED under the strict gate). Re-enable this step,
      # drop `--exit-code` from classify above, and grant `contents: write` to have
      # CI regenerate and push the manifest to the PR branch instead of failing on
      # drift. Under branch protection that push needs a trigger-capable token (see
      # examples/README.md, "Branch protection"); the strict gate above avoids it.
      #
      # - name: Update the baseline manifest on the PR branch
      #     if: ${{ github.event_name == 'pull_request' }}
      #     run: |
      #       set -euo pipefail
      #       screencomp manifest --input shots/current --arch auto --output "$MANIFEST"
      #       if [ -n "$(git status --porcelain "$MANIFEST")" ]; then
      #         git config user.name "github-actions[bot]"
      #         git config user.email "github-actions[bot]@users.noreply.github.com"
      #         git add "$MANIFEST"
      #         git commit -m "chore: update screenshot baseline manifest"
      #         git push
      #       fi

      # ---- main only: publish the blessed gallery to Pages -----------------

      - name: Build gallery
        if: ${{ github.event_name == 'push' }}
        run: screencomp gallery --input shots/current --arch auto --output site --title "Visual docs"
      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        if: ${{ github.event_name == 'push' }}
        uses: actions/deploy-pages@v4

# Local pre-push check (same image as CI, so captures match). On Apple Silicon
# --platform forces the amd64 image under emulation. Enable Docker Desktop's
# Rosetta ("Use Rosetta for x86_64/amd64 emulation"); the swiftshader render path
# can crash Chromium under the QEMU fallback (`qemu: uncaught target signal`).
#
# Run the container as YOURSELF, not root: it bind-mounts your working tree, so a
# root capture leaves everything it writes there owned by root and undeletable
# without sudo. Three things come with that mapping. A host directory you created
# masks node_modules — it still keeps `npm ci` inside the container (matching CI's
# clean checkout), but an anonymous `-v /work/node_modules` volume is created
# root-owned and the install would fail with EACCES. Its mountpoint is created in
# the tree too, since Docker materializes a missing one as root. HOME points into the same
# scratch, because your uid has no entry in the image's passwd file and npm needs
# somewhere to write. And you remove the scratch when you are done with it.
# Behind a TLS-intercepting proxy, also mount your host CA so `npm ci` doesn't die
# with SELF_SIGNED_CERT_IN_CHAIN — add, when "$NODE_EXTRA_CA_CERTS" is set:
# -v "$NODE_EXTRA_CA_CERTS:/host-ca.crt:ro"
# -e NODE_EXTRA_CA_CERTS=/host-ca.crt   (examples/pre-push does this automatically).
#
#   scratch="$(mktemp -d)"
#   mkdir -p "$scratch/node_modules" "$scratch/home" node_modules
#   docker run --rm --platform=linux/amd64 --ipc=host --shm-size=2g \
#     --user "$(id -u):$(id -g)" \
#     -v "$PWD:/work" -v "$scratch:/scratch" \
#     -v "$scratch/node_modules:/work/node_modules" \
#     -e HOME=/scratch/home -w /work \
#     mcr.microsoft.com/playwright:v1.60.0-noble \
#     bash -lc 'npm ci && SHOTS_OUT=shots/current/x86_64 npx playwright test'
#   rm -rf "$scratch"
#   screencomp classify --baseline-manifest shots/baseline/x86_64.json \
#     --current shots/current --arch x86_64 --exit-code
