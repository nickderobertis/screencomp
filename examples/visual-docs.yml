# Example consumer workflow for the visual-docs framework.
#
# Copy this into a consuming repository's `.github/workflows/` and adapt the
# "Capture screenshots" step to your stack. The flow is:
#
#   capture screenshots  ->  screencomp gallery  ->  publish to GitHub Pages
#                        ->  screencomp comment   ->  sticky PR diff comment
#
# Conventions this workflow assumes:
#   * A committed baseline at `shots/baseline/<project>/<name>.png`.
#   * The capture step writes the current run to `shots/current/<project>/<name>.png`.
#   * GitHub Pages is enabled for the repository (Settings -> Pages -> GitHub Actions).
name: Visual docs

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; jobs widen only the scopes they need.
permissions:
  contents: read

concurrency:
  group: visual-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the diff comment
      pages: write # deploy the gallery
      id-token: write # Pages deployment auth
    steps:
      - uses: actions/checkout@v4

      # Install the CLI via the reusable action. Pin to a released major tag.
      - uses: nickderobertis/screencomp@v1
        with:
          version: latest

      # Replace this with your real capture job. It must write PNGs to
      # shots/current/<project>/<name>.png for screencomp to classify them.
      - name: Capture screenshots
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test # writes shots/current/<project>/<name>.png

      - name: Build gallery
        run: screencomp gallery --input shots/current --output site --title "Visual docs"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # On pull requests, render the diff against the baseline and upsert a single
      # sticky comment. screencomp emits a stable HTML marker; `--edit-last` keeps
      # the bot's most recent comment updated instead of posting a new one.
      - name: Comment screenshot diff
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          GALLERY_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          screencomp comment \
            --baseline shots/baseline \
            --current shots/current \
            --gallery-url "${GALLERY_URL}" \
            --output comment.md
          gh pr comment "${PR}" --body-file comment.md --edit-last \
            || gh pr comment "${PR}" --body-file comment.md
