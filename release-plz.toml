# Automated releases from conventional commits, driven by release-plz.
#
# Flow:
#   1. Commits land on `main` (feat -> minor, fix/perf -> patch, `!`/BREAKING ->
#      major; docs/test/chore/ci do not release — enforced by `release_commits`
#      below, not just by changelog grouping). Pre-1.0 follows Cargo's 0.x rules
#      (feat and breaking both bump the minor).
#   2. The `release-pr` job opens/updates a PR that bumps the version in
#      Cargo.toml + Cargo.lock and writes the CHANGELOG section.
#   3. Merging that PR makes the `release` job tag `vX.Y.Z` and cut a GitHub
#      Release. That release (created with a PAT, not the default GITHUB_TOKEN)
#      triggers release.yml (binaries + the gated crate publish) and docker.yml
#      (the versioned image).

[workspace]
# crates.io publishing stays a separate, explicit, opt-in step: the
# `publish-crate` job in release.yml, gated on the PUBLISH_TO_CRATES_IO repo
# variable. release-plz only versions, changelogs, tags, and cuts the GitHub
# Release — it never runs `cargo publish`.
publish = false

# API breaking-change detection (cargo-semver-checks) needs an extra tool and
# would block releases on any lib-surface change; rely on review and the
# conventional-commit type instead. Re-enable once enforceable in CI.
semver_check = false

# Gate a release on the commit *subject* only. release-plz proposes a release
# whenever packaged files change, regardless of type; the [changelog]
# `skip = true` parsers below merely hide a type from the CHANGELOG text and do
# NOT stop the version bump. So without this, any commit that touches packaged
# files (chore, ci, docs, test, build, style) cuts a patch release — and every
# auto-merged `chore: release vX.Y.Z` commit then re-triggers another, looping.
#
# This regex is matched against the WHOLE commit message, so every alternative
# is anchored with `^` to confine matching to the subject line — otherwise a
# message body that merely mentions a releasable keyword would trip the gate.
# A release fires only when the subject is a feature, a fix/perf, or a breaking
# change (`!` on any conventional type). Express breaking changes with `!` in
# the subject (a body-only `BREAKING CHANGE:` footer is intentionally not a
# trigger, to keep prose from cutting releases). Matching commits still get the
# normal conventional-commit bump (feat -> minor pre-1.0, fix/perf -> patch).
release_commits = '^(feat|fix|perf)(\(.+\))?!?:|^[a-z]+(\(.+\))?!:'

# Single binary crate: tag and name each release `vX.Y.Z`.
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# Keep-a-Changelog-style grouping. The version bump is computed from the
# conventional-commit *type*, independent of these display groups — so skipping
# a type from the changelog never changes the bump.
[changelog]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { body = ".*", group = "Other" },
]
