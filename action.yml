name: screencomp
description: Install the screencomp CLI (and optionally run it) for visual-docs gallery and PR-comment workflows.
author: screencomp contributors

branding:
  icon: camera
  color: purple

inputs:
  version:
    description: 'Release tag to install (e.g. v0.1.0) or "latest".'
    required: false
    default: latest
  method:
    description: 'How to obtain the binary: "download" (prebuilt release asset, default) or "source" (cargo install).'
    required: false
    default: download
  args:
    description: 'Optional arguments to run as `screencomp <args>` after install. Leave empty to only install.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install screencomp
      shell: bash
      env:
        SCREENCOMP_VERSION: ${{ inputs.version }}
        SCREENCOMP_METHOD: ${{ inputs.method }}
        # action_repository is the published `owner/repo@ref`; it is empty when
        # the action runs from a local checkout (`uses: ./`), where the release
        # source is the current repository.
        SCREENCOMP_REPO: ${{ github.action_repository || github.repository }}
        SCREENCOMP_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # Environment-only knobs below exist so tests can point the install at a
        # local server and shrink its waits; they are not part of the action's
        # interface and are unset in real runs.
        github_url="${SCREENCOMP_INSTALL_GITHUB_URL:-https://github.com}"
        github_api_url="${SCREENCOMP_INSTALL_GITHUB_API_URL:-https://api.github.com}"
        max_attempts=6
        attempt_timeout="${SCREENCOMP_INSTALL_ATTEMPT_TIMEOUT:-60}"
        retry_base_ms="${SCREENCOMP_INSTALL_RETRY_BASE_MS:-2000}"
        retry_cap_ms="${SCREENCOMP_INSTALL_RETRY_CAP_MS:-15000}"

        fetch() {
          # fetch <description> <url> <destination> [bearer-token]
          # Retries transient failures (5xx, 408, 429, timeouts, dropped
          # connections) with capped exponential backoff, and stops at the first
          # permanent one. The token travels on stdin so it stays out of `ps`.
          local description="$1" url="$2" dest="$3" token="${4:-}"
          local attempt=1 delay_ms="${retry_base_ms}" config="" status exit_code failure transient
          if [ -n "${token}" ]; then
            config="header = \"Authorization: Bearer ${token}\""
          fi
          while :; do
            exit_code=0
            status="$(curl -fsSL -o "${dest}" "${url}" \
              --config - --connect-timeout 10 --max-time "${attempt_timeout}" \
              --write-out '%{http_code}' <<<"${config}")" || exit_code=$?
            if [ "${exit_code}" -eq 0 ]; then
              return 0
            fi
            rm -f "${dest}"
            transient=false
            if [ "${exit_code}" -eq 22 ]; then
              failure="HTTP ${status}"
              case "${status}" in
                408 | 429 | 5??) transient=true ;;
                404)
                  echo "${description} not found (HTTP 404): ${url}" >&2
                  return 1
                  ;;
              esac
            else
              failure="curl exit ${exit_code}"
              case "${exit_code}" in
                # DNS, connect, HTTP/2, partial body, timeout, TLS handshake,
                # empty reply, send/receive errors, HTTP/2 stream errors.
                5 | 6 | 7 | 16 | 18 | 28 | 35 | 52 | 55 | 56 | 92) transient=true ;;
              esac
            fi
            if [ "${transient}" != true ]; then
              echo "${description} failed (${failure}): ${url}" >&2
              return 1
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "${description} failed after ${attempt} attempts (last error: ${failure}): ${url}" >&2
              return 1
            fi
            if [ "${delay_ms}" -gt "${retry_cap_ms}" ]; then
              delay_ms="${retry_cap_ms}"
            fi
            local delay
            delay="$(printf '%d.%03d' "$((delay_ms / 1000))" "$((delay_ms % 1000))")"
            echo "${description} failed (${failure}) on attempt ${attempt}/${max_attempts}; retrying in ${delay}s: ${url}" >&2
            sleep "${delay}"
            delay_ms=$((delay_ms * 2))
            attempt=$((attempt + 1))
          done
        }

        latest_tag() {
          # $1 is a scratch directory. Parsed with grep because neither gh nor
          # jq is guaranteed on a self-hosted runner or job container; an escaped
          # "tag_name" inside a release body cannot match the quoted key.
          local response="$1/latest-release.json" tag_value
          fetch "latest release of ${SCREENCOMP_REPO}" \
            "${github_api_url}/repos/${SCREENCOMP_REPO}/releases/latest" "${response}" "${GH_TOKEN:-}" || return 1
          tag_value="$(grep -Eo '"tag_name"[[:space:]]*:[[:space:]]*"[^"]+"' "${response}" | head -n 1 | sed -E 's/.*"([^"]+)"$/\1/' || true)"
          if [ -z "${tag_value}" ]; then
            echo "latest release of ${SCREENCOMP_REPO} has no tag_name: ${github_api_url}/repos/${SCREENCOMP_REPO}/releases/latest" >&2
            return 1
          fi
          printf '%s\n' "${tag_value}"
        }

        verify_checksum() {
          # $1 is a sha256sum-format file; the archive it names must be in the
          # current directory. Refuse to install a binary that does not match.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check --status "$1"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c "$1" >/dev/null
          else
            echo "no sha256 tool available to verify the download" >&2
            return 1
          fi
        }

        install_from_source() {
          # Build the exact ref the action was pinned to when a checkout is
          # available (reproducible); otherwise build from git. The crate is not
          # yet on crates.io, so source installs come from the repository rather
          # than `cargo install screencomp`.
          if [ -f "${SCREENCOMP_ACTION_PATH}/Cargo.toml" ]; then
            cargo install --path "${SCREENCOMP_ACTION_PATH}" --locked --force
          elif [ "${SCREENCOMP_VERSION}" = "latest" ]; then
            cargo install --git "https://github.com/${SCREENCOMP_REPO}" --locked --force screencomp
          else
            cargo install --git "https://github.com/${SCREENCOMP_REPO}" \
              --tag "${SCREENCOMP_VERSION}" --locked --force screencomp
          fi
          screencomp --version
        }

        install_from_download() {
          if [ -z "${SCREENCOMP_REPO}" ]; then
            echo "download mode needs a published action ref; use 'method: source' for local checkouts" >&2
            return 1
          fi

          local os arch os_part arch_part ext
          os="$(uname -s)"
          arch="$(uname -m)"
          case "${os}" in
            Linux) os_part="unknown-linux-gnu"; ext="tar.gz" ;;
            Darwin) os_part="apple-darwin"; ext="tar.gz" ;;
            MINGW* | MSYS* | CYGWIN* | Windows_NT) os_part="pc-windows-msvc"; ext="zip" ;;
            *) echo "unsupported OS: ${os}" >&2; return 1 ;;
          esac
          case "${arch}" in
            x86_64 | amd64) arch_part="x86_64" ;;
            arm64 | aarch64) arch_part="aarch64" ;;
            *) echo "unsupported architecture: ${arch}" >&2; return 1 ;;
          esac
          if [ "${os_part}" = "apple-darwin" ] && [ "${arch_part}" = "x86_64" ] \
            && [ "$(sysctl -n sysctl.proc_translated 2>/dev/null || true)" = "1" ]; then
            arch_part="aarch64" # Rosetta-translated shell on Apple Silicon
          fi
          if [ "${os_part}" = "apple-darwin" ] && [ "${arch_part}" != "aarch64" ]; then
            echo "Intel macOS is no longer supported; prebuilt macOS binaries are Apple Silicon (arm64) only. Use 'method: source' or an arm64 macOS runner" >&2
            return 1
          fi
          local target="${arch_part}-${os_part}"

          local work; work="$(mktemp -d)"
          local tag="${SCREENCOMP_VERSION}"
          if [ "${tag}" = "latest" ]; then
            tag="$(latest_tag "${work}")"
          fi

          # taiki-e/upload-rust-binary-action names the checksum after the
          # archive stem (no extension) and lists the archive file inside it.
          local stem="screencomp-${tag}-${target}"
          local asset="${stem}.${ext}"
          local sums="${stem}.sha256"
          local base="${github_url}/${SCREENCOMP_REPO}/releases/download/${tag}"
          echo "Installing screencomp ${tag} (${target})"
          fetch "release archive ${asset}" "${base}/${asset}" "${work}/${asset}"
          fetch "release checksum ${sums}" "${base}/${sums}" "${work}/${sums}"
          if ! (cd "${work}" && verify_checksum "${sums}"); then
            echo "refusing to install: ${asset} does not match its published checksum ${sums}" >&2
            return 1
          fi

          local bindir="${RUNNER_TEMP:-${work}}/screencomp-bin"
          mkdir -p "${bindir}"
          case "${ext}" in
            tar.gz) tar -xzf "${work}/${asset}" -C "${bindir}" ;;
            zip) unzip -q "${work}/${asset}" -d "${bindir}" ;;
          esac
          chmod +x "${bindir}/screencomp" 2>/dev/null || true
          echo "${bindir}" >>"${GITHUB_PATH}"
          "${bindir}/screencomp" --version
        }

        case "${SCREENCOMP_METHOD}" in
          download) install_from_download ;;
          source) install_from_source ;;
          *) echo "unknown method '${SCREENCOMP_METHOD}' (expected 'download' or 'source')" >&2; exit 1 ;;
        esac

    - name: Run screencomp
      if: ${{ inputs.args != '' }}
      shell: bash
      env:
        SCREENCOMP_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        # Intentional word splitting so callers can pass multiple arguments.
        # shellcheck disable=SC2086
        screencomp ${SCREENCOMP_ARGS}
