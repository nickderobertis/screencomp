# Behavioral test for scripts/visual-docs-gh-pages.sh — the gh-pages cleanup and
# prune logic the reusable workflow ships. The Rust e2e suite can't reach this
# (it's git-against-a-remote, not the binary), so cover it here by running the
# REAL script against a DISPOSABLE branch on the demo consumer. It never touches
# the demo's real gh-pages: it seeds, asserts, and deletes a throwaway branch
# named per run.
#
# Requires a repo secret SCREENCOMP_DEMO_PAT: a token with contents:write on
# nickderobertis/screencomp-demo (the default GITHUB_TOKEN can't push cross-repo).
# Without it the job no-ops (so forks and unconfigured clones stay green) — and
# a fork PR never receives the secret, so it no-ops there too. Runs on PRs that
# touch the script or the reusable/maintenance workflows, plus manual and weekly.
# Plain pull_request (never pull_request_target): fork code runs without secrets.
name: Test gh-pages maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1" # Mondays, a quiet hour
  pull_request:
    paths:
      - "scripts/visual-docs-gh-pages.sh"
      - ".github/workflows/test-gh-pages-maintenance.yml"
      - ".github/workflows/visual-docs-reusable.yml"

permissions:
  contents: read

# One global lock: serialize every run (PR/dispatch/schedule) so two runs never
# mutate the shared demo repo at once. Deliberately NOT keyed by ref — cross-PR
# runs must not overlap. cancel-in-progress is off so an in-flight run finishes
# its throwaway-branch cleanup instead of being killed mid-mutation.
concurrency:
  group: test-gh-pages-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    env:
      DEMO_REPO: nickderobertis/screencomp-demo
      GIT_TOKEN: ${{ secrets.SCREENCOMP_DEMO_PAT }}
      BRANCH: ci-gh-pages-maint-${{ github.run_id }}
    steps:
      # persist-credentials: false so checkout leaves no github-actions[bot]
      # http.extraheader in git config. That header overrides the PAT embedded in
      # the demo-repo URLs below (notably the delete step, the one git push run
      # from this checkout dir), and the bot has no access to screencomp-demo.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard on the demo PAT
        id: guard
        env:
          PAT: ${{ secrets.SCREENCOMP_DEMO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "SCREENCOMP_DEMO_PAT not set; skipping the gh-pages maintenance test"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi

      # Seed a disposable branch with a canonical page, several version commits,
      # and a pr-7/ preview so prune has real history to collapse and bound.
      - name: Seed the disposable branch
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          url="https://x-access-token:${GIT_TOKEN}@github.com/${DEMO_REPO}.git"
          work="$(mktemp -d)"
          git clone --quiet --depth 1 "$url" "$work"
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan "$BRANCH"
          git rm -rfq . >/dev/null 2>&1 || true
          printf 'canonical\n' > index.html
          git add index.html
          git commit -qm "seed: canonical gallery"
          # Several successive gallery versions so prune has a window to keep and a
          # tail to collapse; the last one is the current site.
          for v in 1 2 3 4; do
            printf 'version %s\n' "$v" > index.html
            git add index.html
            git commit -qm "seed: gallery version $v"
          done
          mkdir -p pr-7
          printf 'preview\n' > pr-7/index.html
          git add pr-7
          git commit -qm "seed: pr-7 preview"
          git push -q origin "$BRANCH"

      - name: cleanup-preview removes the closed PR's directory
        if: steps.guard.outputs.run == 'true'
        env:
          REPO: ${{ env.DEMO_REPO }}
          PR: "7"
        run: |
          set -euo pipefail
          bash scripts/visual-docs-gh-pages.sh cleanup-preview
          chk="$(mktemp -d)"
          git clone --quiet --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${GIT_TOKEN}@github.com/${DEMO_REPO}.git" "$chk"
          if [ -d "$chk/pr-7" ]; then echo "pr-7 was not removed" >&2; exit 1; fi
          if [ ! -f "$chk/index.html" ]; then echo "cleanup clobbered the canonical site" >&2; exit 1; fi
          echo "cleanup-preview ok"

      - name: cleanup-preview is a no-op when the preview is gone
        if: steps.guard.outputs.run == 'true'
        env:
          REPO: ${{ env.DEMO_REPO }}
          PR: "7"
        run: bash scripts/visual-docs-gh-pages.sh cleanup-preview

      # After cleanup the branch has 6 commits (canonical + 4 versions + the
      # cleanup commit). Keep 3: expect those 3 plus one squashed base = 4 commits,
      # with the current site (the latest version) intact.
      - name: prune-history keeps the configured number of recent versions
        if: steps.guard.outputs.run == 'true'
        env:
          REPO: ${{ env.DEMO_REPO }}
          KEEP_VERSIONS: "3"
        run: |
          set -euo pipefail
          bash scripts/visual-docs-gh-pages.sh prune-history
          chk="$(mktemp -d)"
          git clone --quiet --branch "$BRANCH" \
            "https://x-access-token:${GIT_TOKEN}@github.com/${DEMO_REPO}.git" "$chk"
          cd "$chk"
          count="$(git rev-list --count HEAD)"
          if [ "$count" -ne 4 ]; then echo "expected 4 commits after keep=3 prune, got $count" >&2; exit 1; fi
          if [ "$(cat index.html)" != "version 4" ]; then echo "prune lost the current site" >&2; exit 1; fi
          echo "prune-history ok (kept 3 versions + base)"

      # The branch now has 4 commits; keeping 20 leaves it untouched.
      - name: prune-history is a no-op within the version limit
        if: steps.guard.outputs.run == 'true'
        env:
          REPO: ${{ env.DEMO_REPO }}
          KEEP_VERSIONS: "20"
        run: |
          set -euo pipefail
          bash scripts/visual-docs-gh-pages.sh prune-history
          chk="$(mktemp -d)"
          git clone --quiet --branch "$BRANCH" \
            "https://x-access-token:${GIT_TOKEN}@github.com/${DEMO_REPO}.git" "$chk"
          count="$(git -C "$chk" rev-list --count HEAD)"
          if [ "$count" -ne 4 ]; then echo "expected 4 commits unchanged, got $count" >&2; exit 1; fi
          echo "prune-history ok (no-op within limit)"

      - name: prune-history with keep=0 squashes to one commit
        if: steps.guard.outputs.run == 'true'
        env:
          REPO: ${{ env.DEMO_REPO }}
          KEEP_VERSIONS: "0"
        run: |
          set -euo pipefail
          bash scripts/visual-docs-gh-pages.sh prune-history
          chk="$(mktemp -d)"
          git clone --quiet --branch "$BRANCH" \
            "https://x-access-token:${GIT_TOKEN}@github.com/${DEMO_REPO}.git" "$chk"
          cd "$chk"
          count="$(git rev-list --count HEAD)"
          if [ "$count" -ne 1 ]; then echo "expected 1 commit after keep=0 prune, got $count" >&2; exit 1; fi
          if [ ! -f index.html ]; then echo "prune lost the current site" >&2; exit 1; fi
          echo "prune-history ok (keep=0 single commit)"

      # Always remove the throwaway branch, even if an assertion above failed.
      # Tolerate only the genuinely-already-gone case (ls-remote exit 2); a real
      # failure to delete must fail the job, or leaked branches accumulate
      # unnoticed — the exact rot this workflow exists to prevent. Don't blanket
      # `|| echo`: that masked a 403 once already.
      - name: Delete the disposable branch
        if: ${{ always() && steps.guard.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GIT_TOKEN}@github.com/${DEMO_REPO}.git"
          rc=0
          git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            git push --quiet "$url" --delete "$BRANCH"
          elif [ "$rc" -eq 2 ]; then
            echo "branch already gone"
          else
            echo "ls-remote failed (rc=$rc); cannot confirm the throwaway branch is gone" >&2
            exit 1
          fi
