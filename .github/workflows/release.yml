name: Release

# Build and attach the cross-platform binaries for a published release, and
# optionally publish the crate.
#
# The GitHub Release itself is created by release-plz (see release-plz.yml) when
# a version-bump PR merges. Because release-plz uses a PAT, that release fires
# the `release: published` event below. Creating a release by hand (or with
# `gh release create`) is a supported fallback — it triggers the same event.

on:
  release:
    types: [published]

# Least privilege: only the upload job needs write access to attach assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the release on a passing test run so untested artifacts never publish.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked

  # Build, archive, checksum, and attach a binary per target to the Release.
  upload:
    name: upload (${{ matrix.target }})
    needs: test
    permissions:
      contents: write # attach assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per target so nothing cross-compiles: arm64 Linux on a
          # hosted arm64 runner; macOS cross-builds x86_64<->arm64 in-toolchain.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Build, archive, checksum, and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: screencomp
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          include: README.md,LICENSE,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  # crates.io publishing is opt-in: set the repository variable
  # PUBLISH_TO_CRATES_IO=true and provide the CARGO_REGISTRY_TOKEN secret.
  publish-crate:
    needs: [upload]
    if: ${{ vars.PUBLISH_TO_CRATES_IO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
