name: Release

# Build and attach the cross-platform binaries for a published release, and
# optionally publish the crate.
#
# The GitHub Release itself is created by release-plz (see release-plz.yml) when
# a version-bump PR merges. Because release-plz uses a PAT, that release fires
# the `release: published` event below. Creating a release by hand (or with
# `gh release create`) is a supported fallback — it triggers the same event.

on:
  release:
    types: [published]

# Least privilege: only the upload job needs write access to attach assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the release on a passing test run so untested artifacts never publish.
  # `--workspace` covers the crate's suites, the binary e2e suite (its own
  # workspace member) included.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # llmlint: ignore-block[release_does_not_regate_an_already_swept_commit, no_second_broader_sweep_over_an_already_gated_commit, work_goes_through_command_surface, diagnostics_error_or_absent] A hand-cut Release is a supported fallback and this job is its only gate (AGENTS.md, "Release & git"); clippy's -D warnings over the same targets makes a compiler warning fatal here.
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace
      # llmlint: ignore-end[release_does_not_regate_an_already_swept_commit, no_second_broader_sweep_over_an_already_gated_commit, work_goes_through_command_surface, diagnostics_error_or_absent]

  # Each target is compiled once, then installed from its locally staged archive.
  build:
    name: build (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup show
      - uses: extractions/setup-just@v2
      - name: Build and verify staged installer
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-artifact.mjs "$TARGET" "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  # Apple Silicon only: built, packed and install-verified natively on the one
  # arm64 Mac runner. Intel macOS is no longer released.
  build-darwin:
    needs: test
    runs-on: macos-15
    env:
      DARWIN_TARGETS: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup show
      - uses: extractions/setup-just@v2
      - name: Build each target once and run its staged installer
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          read -r -a targets <<< "$DARWIN_TARGETS"
          for target in "${targets[@]}"; do
            node scripts/release-artifact.mjs "$target" "$TAG"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin
          path: dist/release/*
          if-no-files-found: error

  upload:
    needs: [build, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Publish verified archives and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/release/*.tar.gz dist/release/*.zip dist/release/*.sha256

  # crates.io publishing is opt-in: set the repository variable
  # PUBLISH_TO_CRATES_IO=true and provide the CARGO_REGISTRY_TOKEN secret.
  publish-crate:
    needs: [upload]
    if: ${{ vars.PUBLISH_TO_CRATES_IO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Advance the floating major tag (v0 for a 0.x release) to this release, so the
  # reusable workflow and consumers can pin the composable actions to `@v0` and
  # always resolve the latest release. Gated on `upload` so the tag only moves once
  # the release actually has its binary assets (the install action downloads them).
  advance-major-tag:
    needs: [upload]
    permissions:
      contents: write # move the major tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - name: Move v<major> to this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*.*.*) ;;
            *) echo "::error::unexpected release tag '$TAG' (want vX.Y.Z)"; exit 1 ;;
          esac
          major="${TAG%%.*}" # v0.2.2 -> v0
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
          echo "moved $major -> $TAG"
