# screencomp reusable visual-docs workflow.
#
# Call it from a consumer repo and own only the capture; everything downstream —
# the reproducibility gate, the classify check, the gallery, the GitHub Pages
# deploy (a canonical gallery on the default branch, a per-PR preview on PRs),
# and the sticky before/after PR comment — is screencomp's. `screencomp init`
# scaffolds a caller for this file.
#
#   jobs:
#     visual-docs:
#       uses: nickderobertis/screencomp/.github/workflows/visual-docs-reusable.yml@vX.Y.Z
#       with:
#         platform: linux-x86_64
#         capture-command: |
#           npm ci
#           npx playwright install --with-deps chromium
#           npx playwright test          # MUST write $SHOTS_OUT/<project>/<name>.png
#       secrets:
#         push-token: ${{ secrets.VISUAL_DOCS_PUSH_TOKEN }}   # optional
#
# Baselines are image-free: the repo commits only a per-platform digest manifest
# (shots/baseline/<platform>.sha256), never the PNGs. Seed it once before the
# first PR (capture, then `screencomp manifest ... > the .sha256`, and commit it),
# and enable Pages (Settings -> Pages -> GitHub Actions, "Deploy from a branch:
# gh-pages /").
#
# Inline comment thumbnails are fetched through GitHub's anonymous image proxy, so
# they only render from a PUBLIC Pages site. A private Pages gallery still works as
# a link, but its inline previews will not load.
name: Visual docs (reusable)

on:
  workflow_call:
    inputs:
      platform:
        description: Platform key to capture and classify under (e.g. linux-x86_64).
        type: string
        default: linux-x86_64
      capture-command:
        description: Shell that writes $SHOTS_OUT/<project>/<name>.png.
        type: string
        required: true
      container:
        description: Container image the capture runs in (pin to your Playwright version).
        type: string
        default: mcr.microsoft.com/playwright:v1.60.0-noble
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
      screencomp-version:
        description: screencomp release to install, or "latest".
        type: string
        default: latest
      gallery-title:
        description: Title for the generated gallery.
        type: string
        default: Visual docs
      verify:
        description: Capture twice and require byte-identical output (the reproducibility gate).
        type: boolean
        default: true
      pages:
        description: Deploy the gallery to GitHub Pages (canonical on push, per-PR preview on PRs).
        type: boolean
        default: true
    secrets:
      push-token:
        description: >-
          Token that can trigger workflows, used to push the regenerated manifest
          to the PR branch. Only needed when the repo enforces required status
          checks (the default GITHUB_TOKEN cannot trigger runs). See the README's
          "Branch protection".
        required: false

# Serialize Pages deploys: every run writes to the same gh-pages branch, so
# overlapping pushes would race. Per-ref cancellation keeps superseded PR runs
# from piling up.
concurrency:
  group: visual-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-docs:
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    permissions:
      contents: write # commit the regenerated manifest to the PR branch; push gh-pages
      pull-requests: write # post the diff comment
    # Pin the shell so every `run:` step is bash, not the container's /bin/sh.
    # The scripts below use `set -euo pipefail` and `bash -c`, which dash (the
    # default `sh` in many container images) does not support — without this the
    # verify step fails with "pipefail: unknown option". The capture step happens
    # to survive under sh only because it has no bashisms.
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ inputs.platform }}
      SHOTS_OUT: shots/current/${{ inputs.platform }}
      MANIFEST: shots/baseline/${{ inputs.platform }}.sha256
      # Pages URLs (only used when inputs.pages is true). The canonical gallery
      # lives at the site root; each PR gets a /pr-<n>/ preview subpath.
      MAIN_GALLERY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      PR_PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }} # PR branch (empty on push -> the pushed ref)
          token: ${{ secrets.push-token || github.token }}

      - uses: nickderobertis/screencomp@v0.1.10 # install the CLI
        with:
          version: ${{ inputs.screencomp-version }}

      - name: Capture screenshots
        run: ${{ inputs.capture-command }}

      # Reproducibility gate: capture again and require byte-identical output.
      # This is what makes image-free baselines safe. A failure here is almost
      # always a JS-animated or async-rendered widget caught mid-transition (see
      # the README's "Capturing an interactive app").
      - name: Verify capture is reproducible
        if: ${{ inputs.verify }}
        env:
          CAPTURE: ${{ inputs.capture-command }}
        run: |
          set -euo pipefail
          SHOTS_OUT="shots/verify/${PLATFORM}" bash -c "$CAPTURE"
          screencomp verify --first shots/current --second shots/verify --platform "$PLATFORM"
          rm -rf shots/verify

      # The check: compare the capture against the committed digest manifest.
      # Differences are EXPECTED on a feature PR, so this does not fail the job —
      # the change is surfaced by the comment and the committed manifest diff.
      - name: Classify against the baseline manifest
        run: |
          screencomp classify --baseline-manifest "$MANIFEST" \
            --current shots/current --platform "$PLATFORM" || true

      # ---- Gallery + Pages deploy ------------------------------------------

      # A plain gallery of the current capture. In manifest mode there are no
      # baseline PNGs, so this is the current state only; the before/after diff in
      # the PR comment sources "Before" from the canonical main gallery URL.
      - name: Build gallery
        if: ${{ inputs.pages }}
        run: |
          screencomp gallery --input shots/current --platform "$PLATFORM" \
            --output site --title "${{ inputs.gallery-title }}"

      # Default branch -> publish the canonical gallery at the site root.
      - name: Deploy canonical gallery
        if: ${{ inputs.pages && github.event_name == 'push' }}
        uses: peaceiris/actions-gh-pages@v4 # pin to a release you trust
        with:
          github_token: ${{ github.token }}
          publish_dir: site
          keep_files: true # do not clobber existing /pr-<n>/ previews

      # PR -> publish a preview at /pr-<n>/ alongside the canonical gallery.
      - name: Deploy PR preview gallery
        if: ${{ inputs.pages && github.event_name == 'pull_request' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: site
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      # Pages rebuilds asynchronously; wait so the comment's inline images resolve
      # instead of 404ing on first view.
      - name: Wait for the PR preview to go live
        if: ${{ inputs.pages && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsSL -o /dev/null "${PR_PREVIEW_URL}/index.html"; then
              echo "preview live at ${PR_PREVIEW_URL}"
              exit 0
            fi
            sleep 10
          done
          echo "preview not live yet; the comment will still link to it" >&2

      # ---- PR comment + manifest update ------------------------------------

      # Sticky before/after comment. "After" comes from this PR's preview gallery;
      # "Before" from the canonical main gallery (the blessed current state), which
      # is exactly the "gate against the committed baseline, report against main"
      # pattern. Without Pages it degrades to a path listing.
      - name: Comment screenshot diff
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.pages }}" = "true" ]; then
            screencomp comment --baseline-manifest "$MANIFEST" \
              --current shots/current --platform "$PLATFORM" \
              --gallery-url "$PR_PREVIEW_URL" \
              --baseline-url "$MAIN_GALLERY_URL" \
              --output comment.md
          else
            screencomp comment --baseline-manifest "$MANIFEST" \
              --current shots/current --platform "$PLATFORM" --output comment.md
          fi
          gh pr comment "${PR}" --body-file comment.md --edit-last \
            || gh pr comment "${PR}" --body-file comment.md

      # Regenerate the manifest from this run and push it to the PR branch. Its
      # text diff (old hash -> new hash per shot) is the review surface; merging
      # accepts the new baseline. Loop-safe with any token: a re-triggered run
      # regenerates an identical manifest, sees no diff, and does not push.
      - name: Update the baseline manifest on the PR branch
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          screencomp manifest --input shots/current --platform "$PLATFORM" --output "$MANIFEST"
          if [ -n "$(git status --porcelain "$MANIFEST")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$MANIFEST"
            git commit -m "chore: update screenshot baseline manifest"
            git push
          fi
