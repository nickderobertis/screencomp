# End-to-end smoke test for the reusable visual-docs workflow and the
# `visual-docs` composite action.
#
# These can only really be validated where they run — GitHub Actions, with a real
# container job, artifact handoff, host runner, and composite-action steps — not
# by actionlint alone. The jobs invoke them the way a consumer would, with a fake,
# browser-free capture, so every step actually executes in its real environment.
# It catches the bug class that bit us repeatedly: a step that needs a tool its
# environment lacks (gh in the capture container, pipefail under dash, …).
#
# `publish: false` runs every step but performs no external side effects (no PR
# comment, no manifest push, no Pages deploy), so the test is safe to run here.
name: Test reusable workflow

on:
  pull_request:
    paths:
      - .github/workflows/visual-docs-reusable.yml
      - .github/workflows/test-visual-docs.yml
      - visual-docs/action.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/visual-docs-reusable.yml
      - .github/workflows/test-visual-docs.yml
      - visual-docs/action.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The all-in-one reusable workflow: capture in the Playwright container, report
  # on the host. A real consumer's arch matrix is read from `[capture].arches` in
  # their committed screencomp.toml. THIS repo has no root screencomp.toml (one
  # would be auto-discovered by the unit-test suite and break its hermetic
  # fixtures), and a reusable-workflow `uses:` caller cannot inject a step to
  # pre-create one — so the self-test uses the workflow's `arches` override input
  # to supply the matrix directly. That escape hatch exists precisely for callers
  # with no committed config; consumers leave it empty.
  smoke:
    permissions:
      contents: write # the reusable workflow declares it; harmless with publish:false
      pull-requests: write
    uses: ./.github/workflows/visual-docs-reusable.yml
    with:
      arches: '["x86_64"]'
      container: mcr.microsoft.com/playwright:v1.60.0-noble
      # A deterministic, browser-free capture: fixed bytes and fixed hashes in
      # captures.json so the reproducibility gate (capture twice, require the
      # recorded hashes to match) passes.
      capture-command: |
        mkdir -p "$SHOTS_OUT"
        printf 'fake-home-shot' > "$SHOTS_OUT/home.png"
        printf 'fake-about-shot' > "$SHOTS_OUT/about.png"
        cat > "$SHOTS_OUT/captures.json" <<'JSON'
        {"schema":1,"shots":[
        {"name":"home","toggles":{"viewport":"desktop"},"hash":"1111111111111111111111111111111111111111111111111111111111111111","image":"home.png"},
        {"name":"about","toggles":{"viewport":"desktop"},"hash":"2222222222222222222222222222222222222222222222222222222222222222","image":"about.png"}
        ]}
        JSON
      verify: true
      pages: false
      publish: false
      # Exercise the manifest-regeneration path even though it is off by default
      # under the strict gate (publish:false keeps it side-effect-free here).
      update-manifest: true

  # The composite action composed into a consumer's own host job, in both the
  # arch-subtree and project-level (arch: "") layouts.
  action-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        arch: ["x86_64", ""]
    steps:
      - uses: actions/checkout@v4
      # Fake capture (twice, byte-identical) into the right layout for the mode.
      - name: Fake capture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for root in shots/current shots/verify; do
            dir="$root${ARCH:+/$ARCH}"
            mkdir -p "$dir"
            printf 'fake-home-shot' > "$dir/home.png"
            cat > "$dir/captures.json" <<'JSON'
          {"schema":1,"shots":[{"name":"home","toggles":{"viewport":"desktop"},"hash":"1111111111111111111111111111111111111111111111111111111111111111","image":"home.png"}]}
          JSON
          done
      - uses: ./ # install the screencomp CLI on the host
        with:
          # Build the binary from THIS checkout (the PR), not the released asset:
          # a breaking CLI change (e.g. --platform -> --arch) is only exercised by
          # the PR's own binary. `download` mode would fetch the last release and
          # fail on the new flags.
          method: source
      # Seed a baseline from the capture so the classify + comment-render paths
      # (has_baseline == true) are actually exercised, not just the seed path.
      - name: Seed baseline
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ -n "$ARCH" ]; then
            arch_arg="--arch $ARCH"; manifest="shots/baseline/$ARCH.sha256"
          else
            arch_arg=""; manifest="shots/baseline.sha256"
          fi
          mkdir -p "$(dirname "$manifest")"
          # shellcheck disable=SC2086
          screencomp manifest --input shots/current $arch_arg --output "$manifest"
      - uses: ./visual-docs
        with:
          arch: ${{ matrix.arch }}
          verify-second: shots/verify
          pages: false
          publish: false
          update-manifest: true

