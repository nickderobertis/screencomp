name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The gate: a clean checkout, `just bootstrap`, then `just check` at the tier
  # tools/workspace/ci-tier.mjs selects (AGENTS.md, "Release & git"), on every
  # platform the binary ships to. A red sweep fails these same jobs. Branch
  # protection requires every `check (<os>)` context, so nothing here may skip one.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # bash on every leg (Git Bash on Windows), so the tier hand-off below reads
    # the same everywhere.
    defaults:
      run:
        shell: bash
    env:
      # Authenticate cargo-binstall's GitHub API calls in `just bootstrap` so it
      # is not rate-limited into falling back to a source compile.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # Full history: the affected tier's merge base is derived from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Provision pinned toolchain
        run: rustup show
      # Cache the dependency/build artifacts, but NOT ~/.cargo/bin: caching the
      # tool binaries lets binstall's "already installed" metadata survive while
      # the actual cargo-nextest binary is evicted, so `cargo nextest` then 404s.
      # Letting bootstrap reinstall the prebuilt tools every run keeps it
      # authoritative and deterministic.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install just
        uses: extractions/setup-just@v2
      # The Node toolchain Nx runs on, and bun at package.json's packageManager pin
      # for the one bun.lock.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # `just bootstrap` installs cargo-nextest/llvm-cov/deny/machete. With only
      # `cargo install` available it compiles them from source against the pinned
      # 1.89 toolchain, and the newest nextest's MSRV is higher — it fails to
      # build. cargo-binstall fetches the prebuilt release binaries instead, so
      # bootstrap is fast and toolchain-independent (and `_ensure-tools` already
      # prefers it when present).
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Bootstrap
        run: just bootstrap
      - name: Select the gate tier
        id: tier
        run: node tools/workspace/ci-tier.mjs >> "$GITHUB_OUTPUT"
      - name: Check
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          NX_BASE: ${{ steps.tier.outputs.base }}
        run: just check "$TIER"

  # Lint workflows (and their embedded shell) and the Dockerfile. No warnings.
  # Kept separate from `check`: these lint the CI/Docker definitions themselves,
  # which the Rust gate does not cover.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz actionlint
          ./actionlint -color .github/workflows/*.yml examples/*.yml
      - name: hadolint
        run: |
          curl -fsSL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x hadolint
          ./hadolint Dockerfile
      # The gh-pages maintenance and Pages build-gate scripts are shared by the
      # reusable workflow and their tests; actionlint only lints shell embedded in
      # workflows, so lint the extracted scripts here (shellcheck ships on the
      # runner image).
      - name: shellcheck
        run: shellcheck scripts/visual-docs-gh-pages.sh scripts/visual-docs-pages-build.sh

  # Prove the end-user install path, separate from the dev gate: exercise the
  # composite action end to end — install from source, then use the binary it
  # put on PATH in later steps.
  action:
    runs-on: ubuntu-latest
    env:
      # Bypass rust-toolchain.toml's cross-targets for a fast host-only build.
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install via the action
        uses: ./
        with:
          method: source
          args: --version
      - name: Use the installed binary
        run: |
          screencomp --help
          screencomp classify --baseline tests/fixtures/baseline --current tests/fixtures/current

  # Exercise the action's download path against the latest published release —
  # asset naming, checksum verification, and extraction. Requires a release to
  # exist; complements the source-mode job above.
  action-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install via the action (download mode)
        uses: ./
        with:
          method: download
          version: latest
          args: --version
      - name: Use the installed binary
        run: screencomp classify --baseline tests/fixtures/baseline --current tests/fixtures/current
