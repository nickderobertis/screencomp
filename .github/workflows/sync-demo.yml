# Propagate the managed screencomp-integration files in `demo/` to the
# screencomp-demo consumer repo, so that repo never drifts from this CLI's
# interface and a future migration is just an edit to `demo/` here.
#
# It opens a PR on screencomp-demo (never a direct push) so the change is
# reviewable there, and no-ops without the cross-repo token, so forks and
# unconfigured clones are unaffected. The token (SCREENCOMP_DEMO_PAT) needs
# `contents: write` + `pull-requests: write` on screencomp-demo (the default
# GITHUB_TOKEN cannot reach another repo). If it lacks PR scope the sync branch
# is still pushed for a manual PR.
name: Sync demo repo

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - examples/pre-push # reused verbatim as the demo's .githooks/pre-push
      - .github/workflows/sync-demo.yml
  workflow_dispatch:

permissions:
  contents: read

# Serialize syncs so two never race to open competing PRs on the demo.
concurrency:
  group: sync-demo
  cancel-in-progress: false

jobs:
  sync:
    # Only the canonical repo holds the token; forks would no-op anyway.
    if: ${{ github.repository == 'nickderobertis/screencomp' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open a sync PR on screencomp-demo
        env:
          GH_TOKEN: ${{ secrets.SCREENCOMP_DEMO_PAT }}
          DEMO: nickderobertis/screencomp-demo
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "no SCREENCOMP_DEMO_PAT configured; skipping demo sync"
            exit 0
          fi

          srcroot="$PWD"
          work="$(mktemp -d)"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${DEMO}.git" "$work"
          cd "$work"

          # One rolling sync branch off the demo's current main, so a force-push
          # updates the single open sync PR instead of spawning a new one each run.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c screencomp-sync

          # ---- managed file manifest: <src in screencomp> -> <dest in demo> ----
          install -D -m644 "$srcroot/demo/screencomp.toml" "screencomp.toml"
          install -D -m644 "$srcroot/demo/visual-docs.yml"  ".github/workflows/visual-docs.yml"
          install -D -m755 "$srcroot/examples/pre-push"     ".githooks/pre-push"
          # ----------------------------------------------------------------------

          # Idempotent: if the demo already matches (a prior sync PR merged), stop.
          if git diff --quiet; then
            echo "screencomp-demo already in sync; nothing to do"
            exit 0
          fi

          short="${GITHUB_SHA::7}"
          git add -A
          git commit -m "chore: sync screencomp integration files from screencomp@${short}"
          git push -u origin screencomp-sync --force

          body="Automated sync of the managed screencomp-integration files from "
          body+="[nickderobertis/screencomp@${short}](https://github.com/nickderobertis/screencomp/commit/${GITHUB_SHA}) "
          body+="(\`demo/\` subdir).

          Managed files: \`screencomp.toml\`, \`.github/workflows/visual-docs.yml\`, \`.githooks/pre-push\`.

          Baselines and the app/capture are owned by the demo and are not touched."
          # Update the open PR's body, or open one. Best-effort: if the token lacks
          # PR scope the branch is already pushed for a manual PR.
          if ! gh pr edit --repo "$DEMO" screencomp-sync --body "$body" 2>/dev/null; then
            gh pr create --repo "$DEMO" --base main --head screencomp-sync \
              --title "chore: sync screencomp integration files" --body "$body" \
              || echo "could not open PR automatically; branch 'screencomp-sync' is pushed for a manual PR"
          fi

  # Full-visibility verification: mirror the demo's real visual-docs pipeline
  # (its `main`-branch run — a REAL browser capture against the synced config and
  # the released @v0 reusable workflow) into THIS repo's Actions, so "did the
  # consumer actually work" is answered here instead of needing eyes on the demo.
  # This job goes red whenever screencomp-demo's pipeline is red — including, on
  # purpose, while a sync PR is still open (the demo's `main` is not migrated yet),
  # so it stays honest. Re-run this workflow (workflow_dispatch) after merging the
  # sync PR to confirm the demo is green on the new interface.
  verify-demo:
    needs: sync
    if: ${{ always() && github.repository == 'nickderobertis/screencomp' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report screencomp-demo pipeline health
        env:
          GH_TOKEN: ${{ secrets.SCREENCOMP_DEMO_PAT }}
          DEMO: nickderobertis/screencomp-demo
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "no SCREENCOMP_DEMO_PAT configured; cannot verify the demo (skipping)"
            exit 0
          fi

          # Wait out an in-flight run so the verdict reflects the latest capture.
          deadline=$(( $(date +%s) + 1800 ))   # 30 min ceiling
          while :; do
            run="$(gh run list --repo "$DEMO" --workflow 'Visual docs' --branch main \
                    --limit 1 --json status,conclusion,url,headSha 2>/dev/null || echo '[]')"
            if [ "$(jq 'length' <<<"$run")" -eq 0 ]; then
              echo "::warning::no 'Visual docs' run found on ${DEMO}@main yet (the migration PR may be unmerged)"
              exit 0
            fi
            st="$(jq -r '.[0].status' <<<"$run")"
            url="$(jq -r '.[0].url' <<<"$run")"
            if [ "$st" = "completed" ]; then
              concl="$(jq -r '.[0].conclusion' <<<"$run")"
              echo "screencomp-demo@main 'Visual docs': ${concl} — ${url}"
              if [ "$concl" = "success" ]; then
                echo "✅ the demo's real capture→classify→gallery→comment pipeline is green with the managed files"
                exit 0
              fi
              echo "::error::screencomp-demo pipeline is '${concl}' on main — the consumer is broken. See ${url}" >&2
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::demo 'Visual docs' run still '${st}' after the wait — see ${url}"
              exit 0
            fi
            echo "demo run is '${st}'; waiting 30s… (${url})"
            sleep 30
          done
