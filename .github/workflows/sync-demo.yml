# Propagate the managed screencomp-integration files in `demo/` to the
# screencomp-demo consumer repo, so that repo never drifts from this CLI's
# interface and a future migration is just an edit to `demo/` here.
#
# It commits the managed files DIRECTLY to screencomp-demo's `main` (for a fully
# automated, end-to-end loop — no human PR merge), then waits for the resulting
# `Visual docs` run on the demo and mirrors its pass/fail back here. No-ops without
# the cross-repo token, so forks and unconfigured clones are unaffected. The token
# (SCREENCOMP_DEMO_PAT) needs `contents: write` on screencomp-demo (the default
# GITHUB_TOKEN cannot reach another repo); the demo's `main` must allow this push
# (no protection that blocks the bot, or the bot is exempt).
name: Sync demo repo

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - examples/pre-push # reused verbatim as the demo's .githooks/pre-push
      - .github/workflows/sync-demo.yml
  # A published release is when screencomp's capture format can change, which is
  # exactly when the demo's committed baseline may become unreadable by the
  # now-released CLI its @v0 workflow resolves to. Re-run so the baseline reseed
  # below can regenerate it, closing the breaking-change loop without a human.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialize syncs so two never race to push the demo's main.
concurrency:
  group: sync-demo
  cancel-in-progress: false

jobs:
  sync:
    # Only the canonical repo holds the token; forks would no-op anyway.
    if: ${{ github.repository == 'nickderobertis/screencomp' }}
    runs-on: ubuntu-latest
    outputs:
      # The commit pushed to the demo's main (empty when nothing changed), so
      # verify-demo waits for THAT run rather than reading a stale prior one.
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      # Install the SAME released CLI the demo's `@v0` workflow resolves to, so the
      # reseed below reads/writes the baseline in exactly the format the demo's CI
      # will read. On a pre-release `push` this is the OLD CLI and the reseed bails
      # gracefully; the `release` trigger re-runs us once the NEW CLI is published.
      - name: Install the released screencomp
        env:
          # The `secrets` context is not allowed in a step `if:`, so gate on the
          # token inside the script (matches the sync step's no-op-without-secret).
          HAVE_TOKEN: ${{ secrets.SCREENCOMP_DEMO_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${HAVE_TOKEN:-}" ]; then
            echo "no SCREENCOMP_DEMO_PAT configured; skipping screencomp install"
            exit 0
          fi
          scripts/install.sh --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Commit managed files (and reseed a stale baseline) to screencomp-demo main
        id: sync
        env:
          GH_TOKEN: ${{ secrets.SCREENCOMP_DEMO_PAT }}
          DEMO: nickderobertis/screencomp-demo
          # Keep in lockstep with the reusable workflow's `container` default and
          # the pre-push guard: the reseed must capture in the SAME image the demo's
          # CI uses, so the digests are byte-reproducible across the two.
          CAPTURE_IMAGE: mcr.microsoft.com/playwright:v1.60.0-noble
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "no SCREENCOMP_DEMO_PAT configured; skipping demo sync"
            exit 0
          fi

          srcroot="$PWD"
          work="$(mktemp -d)"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${DEMO}.git" "$work"
          cd "$work"

          # ---- mirror the managed demo source onto the demo ---------------------
          # `demo/` IS the demo's source tree (app pages, Playwright config + spec,
          # screencomp.toml, capture.sh, the caller workflow under demo/.github/).
          # Mirror it wholesale so the demo can't drift and can be fixed entirely
          # from here. Preserve what the demo owns or that lives outside the mirror:
          # its .git, its committed baselines (shots/), the hook (installed below),
          # and this internal README.
          rsync -a --delete \
            --exclude='.git/' --exclude='shots/' --exclude='.githooks/' --exclude='README.md' \
            "$srcroot/demo/" ./
          # The pre-push hook is shared with the documented consumer template.
          install -D -m755 "$srcroot/examples/pre-push" ".githooks/pre-push"
          # ----------------------------------------------------------------------

          # ---- reseed the baseline when a screencomp release made it unreadable --
          # A breaking change to screencomp's capture index (filename or schema)
          # leaves the demo's committed baseline unreadable by the now-released CLI,
          # so the demo can only seed-not-gate. Regenerate it from a fresh,
          # deterministic capture in the SAME container CI uses — exactly what the
          # pre-push guard does locally, and sound for the same reason (byte
          # reproducibility within one arch + image). A baseline that merely DRIFTED
          # (still readable) is left untouched: that is the developer's to own, which
          # is the whole point of the strict gate.
          reseed_baseline() {
            command -v screencomp >/dev/null 2>&1 || { echo "screencomp not installed; skip reseed"; return 0; }
            command -v docker     >/dev/null 2>&1 || { echo "docker unavailable; skip reseed"; return 0; }
            local arches
            arches="$(screencomp --config screencomp.toml arches --format json 2>/dev/null)" || {
              echo "the released screencomp cannot read this screencomp.toml yet (pre-release CLI); skip reseed"
              return 0
            }
            local host
            host="$(uname -m)"
            if [ "$host" = "aarch64" ]; then host="arm64"; fi
            local probe
            probe="$(mktemp -d)"
            printf '{"schema":1,"shots":[]}' >"$probe/captures.json"
            local arch manifest stale rc platform
            while IFS= read -r arch; do
              if [ "$arch" != "$host" ]; then
                echo "::warning::cannot reseed shots/baseline/${arch}.json on a ${host} runner; reseed it from a matching-arch runner"
                continue
              fi
              manifest="shots/baseline/${arch}.json"
              stale=0
              if [ ! -f "$manifest" ]; then
                stale=1
              else
                set +e
                screencomp classify --baseline-manifest "$manifest" --current "$probe" --exit-code --quiet >/dev/null 2>&1
                rc=$?
                set -e
                # exit 1 = baseline unreadable (stale format) -> reseed; 0/3 =
                # readable (3 is just drift vs the empty probe) -> leave it alone.
                if [ "$rc" -eq 1 ]; then stale=1; fi
              fi
              if [ "$stale" -eq 0 ]; then
                echo "shots/baseline/${arch}.json is readable; not reseeding"
                continue
              fi
              echo "reseeding shots/baseline/${arch}.json from a fresh ${arch} capture…"
              rm -f shots/baseline/*.sha256   # drop the obsolete pre-JSON baseline
              platform="linux/amd64"
              if [ "$arch" = "arm64" ]; then platform="linux/arm64"; fi
              docker run --rm --platform="$platform" --ipc=host --shm-size=2g \
                -v "$PWD:/work" -v /work/node_modules -w /work \
                "$CAPTURE_IMAGE" \
                bash -lc "SHOTS_OUT=shots/current/${arch} bash capture.sh"
              screencomp manifest --input shots/current --arch "$arch" --output "$manifest"
              echo "reseeded $manifest"
            done < <(echo "$arches" | jq -r '.[]')
          }
          reseed_baseline
          # ----------------------------------------------------------------------

          # Idempotent: nothing to push when the demo already matches. `git status
          # --porcelain` (not `git diff`) so a freshly reseeded, not-yet-tracked
          # baseline counts; capture artifacts (node_modules, shots/current) are
          # gitignored, so they never show here.
          if [ -z "$(git status --porcelain)" ]; then
            echo "screencomp-demo already in sync; nothing to commit"
            exit 0
          fi

          short="${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync screencomp integration files from screencomp@${short}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "committed $(git rev-parse --short HEAD) to ${DEMO}@main"

          # Tidy the obsolete branch from the earlier PR-based sync (deleting it
          # also closes any leftover sync PR). Best-effort; gone after the first run.
          git push origin --delete screencomp-sync 2>/dev/null || true

  # Full-visibility verification: mirror the demo's real `Visual docs` pipeline (a
  # REAL browser capture against the synced config + the released @v0 reusable
  # workflow) into THIS repo's Actions, so "did the consumer actually work" is
  # answered here instead of needing eyes on the demo. Pushing to the demo's main
  # (above) triggers that run on the SYNCED workflow definition; this job waits for
  # the run of the exact commit we pushed and goes RED when it is red.
  verify-demo:
    needs: sync
    if: ${{ always() && github.repository == 'nickderobertis/screencomp' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mirror screencomp-demo pipeline health
        env:
          GH_TOKEN: ${{ secrets.SCREENCOMP_DEMO_PAT }}
          DEMO: nickderobertis/screencomp-demo
          SYNCED_SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "no SCREENCOMP_DEMO_PAT configured; cannot verify the demo (skipping)"
            exit 0
          fi

          deadline=$(( $(date +%s) + 1800 ))   # 30 min ceiling
          while :; do
            runs="$(gh run list --repo "$DEMO" --workflow 'Visual docs' --branch main \
                     --limit 20 --json databaseId,headSha,status,conclusion,url 2>/dev/null || echo '[]')"
            if [ -n "${SYNCED_SHA:-}" ]; then
              # Wait specifically for the run of the commit we just pushed.
              row="$(jq -c --arg s "$SYNCED_SHA" 'map(select(.headSha == $s)) | .[0] // empty' <<<"$runs")"
            else
              # No change to sync this run: report the latest main health instead.
              row="$(jq -c '.[0] // empty' <<<"$runs")"
            fi

            if [ -z "$row" ]; then
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::warning::no 'Visual docs' run found for ${SYNCED_SHA:-latest} on ${DEMO}@main within the wait"
                exit 0
              fi
              echo "waiting for the demo run to register…"
              sleep 30
              continue
            fi

            st="$(jq -r '.status' <<<"$row")"
            url="$(jq -r '.url' <<<"$row")"
            if [ "$st" = "completed" ]; then
              concl="$(jq -r '.conclusion' <<<"$row")"
              echo "screencomp-demo@main 'Visual docs': ${concl} — ${url}"
              if [ "$concl" = "success" ]; then
                echo "✅ the demo's real capture→classify→gallery→comment pipeline is green with the managed files"
                exit 0
              fi
              # Surface WHY here (not just THAT it failed), so the consumer can be
              # diagnosed from screencomp's Actions without opening the demo repo.
              id="$(jq -r '.databaseId' <<<"$row")"
              echo "::group::screencomp-demo failing logs (run ${id})"
              gh run view "$id" --repo "$DEMO" --log-failed 2>&1 | tail -n 200 \
                || echo "(could not fetch demo logs; see ${url})"
              echo "::endgroup::"
              echo "::error::screencomp-demo pipeline is '${concl}' on main — the consumer is broken. See ${url}" >&2
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::demo 'Visual docs' run still '${st}' after the wait — see ${url}"
              exit 0
            fi
            echo "demo run is '${st}'; waiting 30s… (${url})"
            sleep 30
          done
