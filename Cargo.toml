[package]
name = "screencomp"
version = "0.4.3"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Classify, gallery, and PR-comment screenshots for the visual-docs framework — byte-reproducible, network-free."
repository = "https://github.com/nickderobertis/screencomp"
homepage = "https://github.com/nickderobertis/screencomp"
documentation = "https://docs.rs/screencomp"
readme = "README.md"
keywords = ["cli", "screenshots", "visual-regression", "playwright", "gallery"]
categories = ["command-line-utilities", "development-tools::testing"]
# Keep the published crate lean: developer/CI plumbing is not needed by consumers.
exclude = [
    ".github/",
    ".githooks/",
    ".claude/",
    "benches/",
    "examples/",
    "demo/",
    "action.yml",
    "Dockerfile",
    ".dockerignore",
    "lefthook.yml",
    "deny.toml",
    "rustfmt.toml",
    "clippy.toml",
    "justfile",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "AGENTS.md",
    "CLAUDE.md",
]

[dependencies]
camino = { version = "1.2", features = ["serde1"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[dev-dependencies]
assert_cmd = "2"
# Used by in-process integration tests to parse `Cli` the same way the binary does.
clap = { version = "4.6", features = ["derive"] }
predicates = "3"
tempfile = "3"
# Statistical micro-benchmarks of the in-process command pipeline (see
# `benches/`). Default features (plotters HTML reports, rayon) are dropped to
# keep the dependency tree — and the `cargo deny` surface — small;
# `cargo_bench_support` is the only feature `cargo bench` needs, and it still
# emits the per-bench `estimates.json` that `critcmp` diffs.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Optimize CLI release binaries for size and startup without changing panic
# semantics between debug and release builds.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Profiling builds: the shipped release artifact exactly, but with symbols kept
# so `samply` (see `scripts/profile.sh`) can attribute time to functions. This
# never affects the published binary — `just profile` builds `--profile
# profiling` into `target/profiling/` while `[profile.release]` stays stripped.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Statistical micro-benchmarks of the in-process command pipeline. `harness =
# false` hands `main` to Criterion instead of libtest, so `cargo
# nextest`/coverage never pick this target up — it is measured, not gated.
[[bench]]
name = "commands"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "deny"
