# screencomp "visual docs" composite action — the report half of a visual-docs
# pipeline as a single step you drop into your OWN job.
#
# Unlike a reusable workflow (which cannot accept injected steps), this is just a
# step, so you compose it with any steps your capture needs — private-registry
# OIDC auth, extra package installs, a custom container, whatever — without
# reimplementing the framework:
#
#   jobs:
#     visual-docs:
#       runs-on: ubuntu-latest
#       permissions: { contents: write, pull-requests: write }
#       steps:
#         - uses: actions/checkout@v4
#         - uses: your-org/codeartifact-npm-auth@v1     # inject anything
#         - run: npm ci && npx playwright test          # your capture -> shots/current/<platform>/...
#         - uses: nickderobertis/screencomp@vX.Y.Z       # install the CLI
#         - uses: nickderobertis/screencomp/visual-docs@vX.Y.Z
#           with:
#             platform: linux-x86_64        # "" for a project-level layout (no platform subtree)
#             github-token: ${{ github.token }}
#
# It expects the capture to already be on disk (default shots/current) and
# screencomp to be installed (run nickderobertis/screencomp first). It needs host
# tools (gh, git) AND a real git checkout — run it in a HOST job that consumes the
# capture as an artifact, never inside the capture container (container checkouts
# often lack .git, which breaks the manifest push and the comment's base-ref diff).
# Keep git/hook steps out of the capture container; keep capture byte-stable there.
name: screencomp visual docs
description: >-
  Classify a capture against the baseline digest manifest, build the gallery,
  deploy GitHub Pages, and post the sticky before/after PR comment. Compose it in
  your own job after your capture step.
author: screencomp contributors
branding:
  icon: camera
  color: purple

inputs:
  arch:
    description: 'CPU arch (e.g. x86_64, arm64). Empty means a project-level layout with no arch subtree.'
    required: false
    default: ''
  current:
    description: 'Directory holding the current capture (<dir>/[<arch>/]<project>/<name>.png).'
    required: false
    default: shots/current
  verify-second:
    description: 'A second capture of the same build; when set, assert it is byte-identical to `current` (the reproducibility gate).'
    required: false
    default: ''
  manifest:
    description: 'Committed baseline manifest. Defaults to shots/baseline/<arch>.sha256 (or shots/baseline.sha256 when arch is empty).'
    required: false
    default: ''
  gallery-title:
    description: 'Title for the generated gallery.'
    required: false
    default: Visual docs
  pages:
    description: 'Build the gallery and (when publishing) deploy it to GitHub Pages.'
    required: false
    default: 'true'
  publish:
    description: 'Perform external side effects (PR comment, manifest push, Pages deploy). Set false for a dry run.'
    required: false
    default: 'true'
  fail-on-drift:
    description: >-
      Fail the step when the capture drifts from the committed baseline manifest
      (the strict gate, default). The developer regenerates and commits the
      baseline locally with the pre-push guard; this is the backstop. Set false to
      auto-accept drift as a loud warning instead of a failed check.
    required: false
    default: 'true'
  update-manifest:
    description: >-
      Regenerate the baseline manifest and (when publishing, on a PR) push it. Off
      by default: under the strict gate the developer owns the baseline. Turn on
      (with fail-on-drift:false) for the CI-auto-accept model.
    required: false
    default: 'false'
  comment-base-ref:
    description: >-
      Git ref whose committed manifest is the PR comment's "Before". Defaults to the
      PR base branch, so the comment shows the intended before/after even though
      classify gates against the (already-updated) committed baseline. Empty/unknown
      falls back to diffing the committed manifest.
    required: false
    default: ''
  gallery-url:
    description: 'Override the "After" image base URL for the comment (defaults to this PR''s Pages preview).'
    required: false
    default: ''
  baseline-url:
    description: 'Override the "Before" image base URL for the comment (defaults to the canonical main gallery).'
    required: false
    default: ''
  github-token:
    description: 'Token for posting the PR comment and deploying Pages.'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Resolve config
      id: cfg
      shell: bash
      run: |
        set -euo pipefail
        arch='${{ inputs.arch }}'
        # Each arch lives in its own subtree, baseline, gallery subpath, and
        # sticky comment, so multiple arch lanes never clobber one another.
        if [ -n "$arch" ]; then
          echo "arch_arg=--arch $arch" >>"$GITHUB_OUTPUT"
          echo "marker_arg=--marker screencomp-${arch}" >>"$GITHUB_OUTPUT"
          default_manifest="shots/baseline/${arch}.sha256"
          subpath="/${arch}"          # leading slash: appended to a URL/dir
          dest="${arch}"              # Pages destination subdir
        else
          echo "arch_arg=" >>"$GITHUB_OUTPUT"
          echo "marker_arg=" >>"$GITHUB_OUTPUT"
          default_manifest="shots/baseline.sha256"
          subpath=""
          dest=""
        fi
        echo "dest=$dest" >>"$GITHUB_OUTPUT"
        echo "subpath=$subpath" >>"$GITHUB_OUTPUT"
        manifest='${{ inputs.manifest }}'
        [ -n "$manifest" ] || manifest="$default_manifest"
        echo "manifest=$manifest" >>"$GITHUB_OUTPUT"
        if [ -f "$manifest" ]; then
          echo "has_baseline=true" >>"$GITHUB_OUTPUT"
        else
          echo "has_baseline=false" >>"$GITHUB_OUTPUT"
          echo "no committed baseline at $manifest; this run seeds it"
        fi

        # Comment image URLs: derive from the Pages deployment unless overridden.
        # Each arch deploys to its own subpath so its preview/canonical URL is
        # arch-specific.
        gallery_url='${{ inputs.gallery-url }}'
        baseline_url='${{ inputs.baseline-url }}'
        main_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        preview_url="${main_url}/pr-${{ github.event.pull_request.number }}${subpath}"
        if [ "${{ inputs.pages }}" = "true" ] && [ "${{ inputs.publish }}" = "true" ]; then
          [ -n "$gallery_url" ] || gallery_url="$preview_url"
          [ -n "$baseline_url" ] || baseline_url="${main_url}${subpath}"
        fi
        echo "gallery_url=$gallery_url" >>"$GITHUB_OUTPUT"
        echo "baseline_url=$baseline_url" >>"$GITHUB_OUTPUT"
        echo "preview_url=$preview_url" >>"$GITHUB_OUTPUT"

    # Fail loudly if a needed host tool is missing — the usual symptom of running
    # this inside a capture container instead of a host job.
    - name: Check tooling
      shell: bash
      run: |
        set -euo pipefail
        screencomp --version
        git --version
        gh --version

    - name: Verify capture is reproducible
      if: ${{ inputs.verify-second != '' }}
      shell: bash
      run: |
        set -euo pipefail
        screencomp verify --first '${{ inputs.current }}' --second '${{ inputs.verify-second }}' ${{ steps.cfg.outputs.arch_arg }}

    - name: Classify against the baseline manifest
      if: ${{ steps.cfg.outputs.has_baseline == 'true' }}
      shell: bash
      run: |
        set -uo pipefail
        screencomp classify --baseline-manifest '${{ steps.cfg.outputs.manifest }}' \
          --current '${{ inputs.current }}' ${{ steps.cfg.outputs.arch_arg }} --exit-code
        status=$?
        if [ "$status" -eq 3 ]; then
          if [ "${{ inputs.fail-on-drift }}" = "true" ]; then
            echo "::error::Screenshots drifted from the committed baseline (${{ steps.cfg.outputs.manifest }}). Regenerate it locally with the pre-push guard and commit it, or set fail-on-drift:false to auto-accept." >&2
            exit 3
          fi
          echo "::warning::Baseline drifted and was auto-accepted (fail-on-drift:false); changes can slip through unnoticed. Set fail-on-drift:true plus the pre-push guard for a hard gate." >&2
        elif [ "$status" -ne 0 ]; then
          exit "$status"
        fi

    - name: Build gallery
      if: ${{ inputs.pages == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        screencomp gallery --input '${{ inputs.current }}' ${{ steps.cfg.outputs.arch_arg }} \
          --output site --title '${{ inputs.gallery-title }}'

    - name: Deploy canonical gallery
      if: ${{ inputs.pages == 'true' && inputs.publish == 'true' && github.event_name == 'push' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ inputs.github-token }}
        publish_dir: site
        # Each arch deploys to its own subdir (empty -> root for a project-level
        # layout) so lanes coexist on the canonical gallery.
        destination_dir: ${{ steps.cfg.outputs.dest }}
        keep_files: true

    - name: Deploy PR preview gallery
      if: ${{ inputs.pages == 'true' && inputs.publish == 'true' && github.event_name == 'pull_request' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ inputs.github-token }}
        publish_dir: site
        destination_dir: pr-${{ github.event.pull_request.number }}${{ steps.cfg.outputs.subpath }}
        keep_files: true

    - name: Wait for the PR preview to go live
      if: ${{ inputs.pages == 'true' && inputs.publish == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      run: |
        set -euo pipefail
        url='${{ steps.cfg.outputs.preview_url }}'
        for _ in $(seq 1 30); do
          if curl -fsSL -o /dev/null "${url}/index.html"; then
            echo "preview live at ${url}"
            exit 0
          fi
          sleep 10
        done
        echo "preview not live yet; the comment will still link to it" >&2

    # Resolve the manifest the COMMENT diffs against. Under the strict gate the
    # committed manifest already matches the current capture, so source "Before"
    # from the PR base branch's manifest to show the intended before/after.
    # classify still gates against the committed manifest — gate vs committed,
    # comment vs base.
    - name: Resolve comment baseline
      id: cbase
      if: ${{ github.event_name == 'pull_request' && steps.cfg.outputs.has_baseline == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        manifest='${{ steps.cfg.outputs.manifest }}'
        base_ref='${{ inputs.comment-base-ref }}'
        [ -n "$base_ref" ] || base_ref='${{ github.base_ref }}'
        comment_manifest="$manifest"
        if [ -n "${base_ref// }" ]; then
          git fetch --depth=1 origin "$base_ref" || true
          if git show "origin/${base_ref}:${manifest}" >base-manifest.sha256 2>/dev/null; then
            comment_manifest="base-manifest.sha256"
            echo "comment 'Before' sourced from origin/${base_ref}:${manifest}"
          else
            echo "no manifest at origin/${base_ref}:${manifest}; comparing against the committed one"
          fi
        fi
        echo "manifest=$comment_manifest" >>"$GITHUB_OUTPUT"

    - name: Render PR comment
      if: ${{ github.event_name == 'pull_request' && steps.cfg.outputs.has_baseline == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        args=(--baseline-manifest '${{ steps.cbase.outputs.manifest }}'
          --current '${{ inputs.current }}' ${{ steps.cfg.outputs.arch_arg }}
          ${{ steps.cfg.outputs.marker_arg }} --output comment.md)
        # Explicit `if`, not `cond && cmd`: the latter trips `set -e` when the
        # condition is false.
        if [ -n '${{ steps.cfg.outputs.gallery_url }}' ]; then
          args+=(--gallery-url '${{ steps.cfg.outputs.gallery_url }}')
        fi
        if [ -n '${{ steps.cfg.outputs.baseline_url }}' ]; then
          args+=(--baseline-url '${{ steps.cfg.outputs.baseline_url }}')
        fi
        screencomp comment "${args[@]}"

    # Upsert by MARKER, not --edit-last. `screencomp comment` embeds a stable
    # `<!-- screencomp[-<arch>] -->` HTML marker exactly so the right comment can be
    # found and edited. This is what lets each arch keep its OWN sticky comment:
    # --edit-last would make every arch lane clobber the single most-recent comment.
    - name: Post PR comment
      if: ${{ github.event_name == 'pull_request' && steps.cfg.outputs.has_baseline == 'true' && inputs.publish == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # The first HTML comment in the body is the upsert marker (per-arch).
        marker="$(grep -m1 -o '<!--[^>]*-->' comment.md)"
        if [ -z "$marker" ]; then
          echo "::error::no upsert marker found in comment.md" >&2
          exit 1
        fi
        # Find an existing comment carrying this marker (most recent wins).
        id="$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
          --jq "map(select(.body | contains(\"${marker}\"))) | last | .id // empty")"
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/${REPO}/issues/comments/${id}" \
            -F body=@comment.md >/dev/null
        else
          gh pr comment "$PR" --body-file comment.md
        fi

    - name: Update the baseline manifest
      if: ${{ inputs.update-manifest == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        screencomp manifest --input '${{ inputs.current }}' ${{ steps.cfg.outputs.arch_arg }} \
          --output '${{ steps.cfg.outputs.manifest }}'

    - name: Push the baseline manifest
      if: ${{ inputs.update-manifest == 'true' && inputs.publish == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      run: |
        set -euo pipefail
        manifest='${{ steps.cfg.outputs.manifest }}'
        if [ -n "$(git status --porcelain "$manifest")" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "chore: update screenshot baseline manifest"
          git push
        fi
